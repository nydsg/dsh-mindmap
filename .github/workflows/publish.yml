# Publishing is done from the runner, not from a laptop: the maintainer's
# network cannot reach registry.npmjs.org, but GitHub's can. `prepack` runs the
# gates again here, so a red gate aborts the upload before anything leaves the
# machine.
#
# Publishing runs through trusted publishing (OIDC): npm checks that the job
# belongs to `nydsg/dsh-mindmap`'s publish.yml and mints a short-lived
# credential, so no token and no interactive 2FA are involved.
#
# The very first version cannot use this. npm's OIDC exchange answers "package
# not found" until a real version exists, and the `0.0.0-stage` placeholder that
# `npm stage publish` leaves behind does not count. That one release has to be
# approved with 2FA — stage it, then Approve on npmjs.com — after which this
# step works untouched.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the CLI exchange a GitHub OIDC token for a publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 24: the gates run here through `prepack`, so this job must
      # use a runtime the CI matrix already covers.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the
          # runner's .npmrc, so the token fallback below is already wired up.
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, and trusted publishing needs 11.5.1 or later.
      # Staying on the 11.x line avoids npm 12, which wants a newer Node than
      # the 22.x releases always provide.
      - name: npm 11 for trusted publishing
        run: npm install --global npm@^11.15.0

      # --access public is required for a scope package, and the explicit
      # registry keeps a stray mirror setting from silently swallowing the upload.
      # --access public is required for a scope package, and the explicit
      # registry keeps a stray mirror setting from silently swallowing the upload.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --registry=https://registry.npmjs.org/ --access public

      - name: verify the version is live
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npm view "$name@$version" version --registry=https://registry.npmjs.org/
