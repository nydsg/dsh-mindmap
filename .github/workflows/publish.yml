# Publishing is done from the runner, not from a laptop: the maintainer's
# network cannot reach registry.npmjs.org, but GitHub's can. `prepack` runs the
# gates again here, so a red gate aborts the upload before anything leaves the
# machine.
#
# Publishing runs through trusted publishing (OIDC): npm checks that the job
# belongs to `nydsg/dsh-mindmap`'s publish.yml and mints a short-lived
# credential, so no token and no interactive 2FA are involved. The name had to
# be claimed with one staged publish first, because trusted publishing needs the
# package to already exist.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the CLI exchange a GitHub OIDC token for a publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 24: the gates run here through `prepack`, so this job must
      # use a runtime the CI matrix already covers.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the
          # runner's .npmrc, so the token fallback below is already wired up.
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, and trusted publishing needs 11.5.1 or later.
      # Staying on the 11.x line avoids npm 12, which wants a newer Node than
      # the 22.x releases always provide.
      - name: npm 11 for trusted publishing
        run: npm install --global npm@^11.15.0

      # --access public is required for a scope package, and the explicit
      # registry keeps a stray mirror setting from silently swallowing the upload.
      # --access public is required for a scope package, and the explicit
      # registry keeps a stray mirror setting from silently swallowing the upload.
      #
      # The CLI treats a failed OIDC exchange as "not configured" and quietly
      # falls back to the token, which then fails 2FA with a message about
      # tokens. This step asks the same endpoint directly so the real reason —
      # a mismatched owner, repository, workflow filename or allowed action —
      # ends up in the log instead of being swallowed.
      - name: trusted publishing diagnostics
        run: |
          echo "id-token request url:   ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "id-token request token: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::GitHub did not expose an OIDC request URL; the job is missing 'id-token: write'."
            exit 1
          fi
          id_token=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).value||'')}catch(e){console.log('')}})")
          echo "id token length: ${#id_token}"
          echo "--- registry view ---"
          npm view @nydsg/dsh-mindmap dist-tags versions \
            --registry=https://registry.npmjs.org/ || echo "<npm view failed>"
          # npm itself builds the path with a raw slash (npa().escapedName), so
          # try that form first and keep the percent-encoded one for contrast.
          for path in "@nydsg/dsh-mindmap" "@nydsg%2Fdsh-mindmap"; do
            echo "--- OIDC exchange: package/$path ---"
            curl -sS -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$path" \
              | head -c 600 || true
            echo
          done

      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --registry=https://registry.npmjs.org/ --access public

      - name: verify the version is live
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npm view "$name@$version" version --registry=https://registry.npmjs.org/
