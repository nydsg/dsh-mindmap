# Publishing is done from the runner, not from a laptop: the maintainer's
# network cannot reach registry.npmjs.org, but GitHub's can. `prepack` runs the
# gates again here, so a red gate aborts the upload before anything leaves the
# machine.
#
# The version goes to the staging area, not straight to the registry: npm no
# longer issues tokens that bypass 2FA, and trusted publishing needs the package
# to already exist, so a brand-new name can only be claimed with
# `npm stage publish` plus a maintainer approving it on npmjs.com. Staging needs
# no 2FA; the approval does. Once the name exists, configure a trusted publisher
# and the same step keeps working through OIDC.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the CLI exchange a GitHub OIDC token for a publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 24: the gates run here through `prepack`, so this job must
      # use a runtime the CI matrix already covers.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into the
          # runner's .npmrc, so the token fallback below is already wired up.
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x, and staged publishing needs 11.15.0 or later.
      # Staying on the 11.x line avoids npm 12, which wants a newer Node than
      # the 22.x releases always provide.
      - name: npm 11 for staged publishing
        run: npm install --global npm@^11.15.0

      # --access public is required for a scope package, and the explicit
      # registry keeps a stray mirror setting from silently swallowing the upload.
      # Staging the first version also claims the name, by publishing a
      # placeholder that shows up as 0.0.0-stage.
      - name: stage the version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --registry=https://registry.npmjs.org/ --access public

      - name: show what to approve
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          live=$(npm view "$name" dist-tags.latest --registry=https://registry.npmjs.org/ 2>/dev/null || echo "<name not claimed yet>")
          echo "staged: $name@$version"
          echo "live:   $live"
          echo "approve: https://www.npmjs.com/package/$name"
